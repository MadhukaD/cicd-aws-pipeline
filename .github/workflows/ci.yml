name: ci

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    lint-and-test:
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.12"
                cache: pip
                cache-dependency-path: requirements*.txt

            - name: Install dependencies
              run: pip install -r requirements-dev.txt

            - name: Lint
              run: ruff check .

            - name: Check formatting
              run: ruff format --check .

            - name: Test
              run: pytest

    build-and-scan:
        runs-on: ubuntu-latest
        needs: lint-and-test
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Check out code
              uses: actions/checkout@v4

            - name: Build Docker image
              run: docker build -t cicd-demo:${{ github.sha}} .

            - name: Scan image with Trivy
              uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
              with:
                version: v0.69.3
                image-ref: cicd-demo:${{ github.sha}}
                severity: HIGH,CRITICAL
                ignore-unfixed: true
                exit-code: "1"

            - name: DEBUG show OIDC claims
              run: |
                TOKEN=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                  "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
                echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq '{sub, aud, repository, ref}'

            - name: Configure AWS credentials (OIDC)
              if: github.ref == 'refs/heads/main' && github.event_name == 'push'
              uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
              with:
                role-to-assume: ${{ vars.AWS_ROLE_ARN }}
                aws-region: ${{ vars.AWS_REGION }}

            - name: Show AWS identity
              if: github.ref == 'refs/heads/main' && github.event_name == 'push'
              run: aws sts get-caller-identity

            - name: Log in to Amazon ECR
              id: ecr-login
              if: github.ref == 'refs/heads/main' && github.event_name == 'push'
              uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

            - name: Tag and push image
              if: github.ref == 'refs/heads/main' && github.event_name == 'push'
              run: |
                IMAGE="${{ steps.ecr-login.outputs.registry }}/cicd-demo:${{ github.sha}}"
                docker tag cicd-demo:${{ github.sha }} "$IMAGE"
                docker push "$IMAGE"
